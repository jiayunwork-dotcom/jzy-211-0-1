services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diode
      POSTGRES_PASSWORD: diode
      POSTGRES_DB: diode
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diode -d diode"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://diode:diode@db:5432/diode
      FIT_RESIDUAL_THRESHOLD: "0.10"
      NOISE_FLOOR: "1e-12"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
